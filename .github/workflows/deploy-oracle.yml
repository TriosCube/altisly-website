name: Deploy Oracle

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: altisly-oracle-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Validate required secrets
        env:
          PROD_HOST: ${{ secrets.PROD_HOST }}
          PROD_USER: ${{ secrets.PROD_USER }}
          PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
        run: |
          set -eu
          for v in PROD_HOST PROD_USER PROD_SSH_KEY; do
            eval "val=\${$v}"
            [ -n "$val" ] || { echo "Missing required secret: $v" >&2; exit 1; }
          done

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build Nuxt app
        env:
          NODE_ENV: production
        run: bunx nuxi build

      - name: Configure SSH
        env:
          PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
        run: |
          set -eu
          install -m 700 -d ~/.ssh
          printf '%s\n' "$PROD_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf 'Host *\n  ServerAliveInterval 30\n  ServerAliveCountMax 20\n' > ~/.ssh/config
          chmod 600 ~/.ssh/config

      - name: Add server host key
        env:
          PROD_HOST: ${{ secrets.PROD_HOST }}
          PROD_PORT: ${{ secrets.PROD_PORT || '22' }}
        run: ssh-keyscan -p "$PROD_PORT" -H "$PROD_HOST" >> ~/.ssh/known_hosts

      - name: Prepare host
        env:
          PROD_HOST: ${{ secrets.PROD_HOST }}
          PROD_PORT: ${{ secrets.PROD_PORT || '22' }}
          PROD_USER: ${{ secrets.PROD_USER }}
          SHA: ${{ github.sha }}
        run: |
          set -eu
          # Fetched over HTTPS rather than rsynced: rsync may not exist yet.
          ssh -p "$PROD_PORT" -i ~/.ssh/id_deploy "$PROD_USER@$PROD_HOST" \
            "SHA='$SHA' bash -s" <<'REMOTE'
          set -eu
          if /opt/node/bin/node --version >/dev/null 2>&1 && command -v caddy >/dev/null 2>&1; then
            echo "Host already provisioned."
            exit 0
          fi
          curl -fsSL "https://raw.githubusercontent.com/TriosCube/altisly-website/$SHA/scripts/bootstrap-host.sh" | bash
          REMOTE

      - name: Sync build output
        env:
          PROD_HOST: ${{ secrets.PROD_HOST }}
          PROD_PORT: ${{ secrets.PROD_PORT || '22' }}
          PROD_USER: ${{ secrets.PROD_USER }}
        run: |
          set -eu
          APP_DIR="/home/$PROD_USER/altisly-website"
          SSH_CMD="ssh -p $PROD_PORT -i ~/.ssh/id_deploy"
          $SSH_CMD "$PROD_USER@$PROD_HOST" "mkdir -p $APP_DIR/build-output/output $APP_DIR/scripts $APP_DIR/data"
          # scp rather than rsync, which the host may not have.
          tar -czf /tmp/output.tar.gz -C .output .
          scp -P "$PROD_PORT" -i ~/.ssh/id_deploy /tmp/output.tar.gz "$PROD_USER@$PROD_HOST:/tmp/output.tar.gz"
          scp -P "$PROD_PORT" -i ~/.ssh/id_deploy scripts/install-services.sh "$PROD_USER@$PROD_HOST:$APP_DIR/scripts/"
          $SSH_CMD "$PROD_USER@$PROD_HOST" \
            "rm -rf $APP_DIR/build-output/output && mkdir -p $APP_DIR/build-output/output && \
             tar -xzf /tmp/output.tar.gz -C $APP_DIR/build-output/output && rm -f /tmp/output.tar.gz && \
             chmod +x $APP_DIR/scripts/install-services.sh"

      - name: Deploy on server
        env:
          PROD_HOST: ${{ secrets.PROD_HOST }}
          PROD_PORT: ${{ secrets.PROD_PORT || '22' }}
          PROD_USER: ${{ secrets.PROD_USER }}
          CADDY_EMAIL: ${{ secrets.CERTBOT_EMAIL }}
          BLOG_ADMIN_USERNAME: ${{ secrets.BLOG_ADMIN_USERNAME }}
          BLOG_ADMIN_PASSWORD: ${{ secrets.BLOG_ADMIN_PASSWORD }}
          BLOG_ADMIN_SESSION_SECRET: ${{ secrets.BLOG_ADMIN_SESSION_SECRET }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_BASE_URL: ${{ secrets.DEEPSEEK_BASE_URL }}
          DEEPSEEK_MODEL: ${{ secrets.DEEPSEEK_MODEL }}
          ENQUIRY_SMTP_HOST: ${{ secrets.ENQUIRY_SMTP_HOST }}
          ENQUIRY_SMTP_PORT: ${{ secrets.ENQUIRY_SMTP_PORT }}
          ENQUIRY_SMTP_SECURE: ${{ secrets.ENQUIRY_SMTP_SECURE }}
          ENQUIRY_SMTP_USER: ${{ secrets.ENQUIRY_SMTP_USER }}
          ENQUIRY_SMTP_PASS: ${{ secrets.ENQUIRY_SMTP_PASS }}
          ENQUIRY_SMTP_FROM: ${{ secrets.ENQUIRY_SMTP_FROM }}
        run: |
          set -eu
          APP_DIR="/home/$PROD_USER/altisly-website"
          {
            for v in BLOG_ADMIN_USERNAME BLOG_ADMIN_PASSWORD BLOG_ADMIN_SESSION_SECRET \
                     DEEPSEEK_API_KEY DEEPSEEK_BASE_URL DEEPSEEK_MODEL \
                     ENQUIRY_SMTP_HOST ENQUIRY_SMTP_PORT ENQUIRY_SMTP_SECURE \
                     ENQUIRY_SMTP_USER ENQUIRY_SMTP_PASS ENQUIRY_SMTP_FROM; do
              eval "val=\${$v:-}"
              printf '%s=%s\n' "$v" "$val"
            done
          } > env.prod.generated
          ENV_B64="$(base64 -w0 < env.prod.generated)"

          ssh -p "$PROD_PORT" -i ~/.ssh/id_deploy "$PROD_USER@$PROD_HOST" \
            "APP_DIR='$APP_DIR' ENV_B64='$ENV_B64' CADDY_EMAIL='${CADDY_EMAIL:-admin@altisly.com}' bash -s" <<'REMOTE'
          set -eu
          cd "$APP_DIR"
          umask 077
          printf '%s' "$ENV_B64" | base64 -d > .env.prod
          chmod 600 .env.prod
          SITE=altisly DOMAIN=altisly.com PORT=3300 \
            CADDY_EMAIL="$CADDY_EMAIL" APP_DIR="$APP_DIR" ./scripts/install-services.sh
          sudo systemctl restart altisly
          sudo systemctl restart caddy
          REMOTE

      - name: Verify it is serving
        env:
          PROD_HOST: ${{ secrets.PROD_HOST }}
          PROD_PORT: ${{ secrets.PROD_PORT || '22' }}
          PROD_USER: ${{ secrets.PROD_USER }}
        run: |
          set -eu
          ssh -p "$PROD_PORT" -i ~/.ssh/id_deploy "$PROD_USER@$PROD_HOST" bash -s <<'REMOTE'
          set -eu
          for i in $(seq 1 30); do
            if curl -sf -o /dev/null http://127.0.0.1:3300; then
              echo "app is serving on :3300"
              systemctl is-active altisly caddy
              exit 0
            fi
            sleep 5
          done
          echo "app did not come up" >&2
          sudo journalctl -u altisly -n 40 --no-pager >&2 || true
          exit 1
          REMOTE
