server {
    listen 80;
    server_name altisly.com www.altisly.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name altisly.com www.altisly.com;

    ssl_certificate     /etc/letsencrypt/live/altisly.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/altisly.com/privkey.pem;

    client_max_body_size 20M;

    location / {
        proxy_pass         http://altisly-website:3300;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection 'upgrade';
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
    }
}
